<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leave By</title>
<style>
  :root {
    /* Bright accents behind mirror glass, matching the Weather widget. */
    --text: #e2e8f0;
    --text-soft: #cbd5e1;
    --text-muted: #94a3b8;
    --kicker: #7dd3fc;
    --tomorrow: #c4b5fd;
    --distant: #7dd3fc;
    --approaching: #fbbf24;
    --now-bg: #ef4444;
    --now-fg: #fff7ed;
    --line: rgba(148, 163, 184, 0.35);
    --field-border: rgba(100, 116, 139, 0.8);
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  /* Everything is in rem so resizing the widget frame scales the layout. */
  html { font-size: clamp(9px, 4vmin, 26px); }
  body {
    background: #000000;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .pane { display: none; height: 100%; padding: 1.1rem 1.4rem 1rem; flex-direction: column; }
  .pane.active { display: flex; }

  .top-row { display: flex; align-items: baseline; gap: 0.6rem; }
  .kicker {
    font-size: 0.8rem; font-weight: 700; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--kicker); white-space: nowrap;
  }
  .chip {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--tomorrow); border: 1px solid currentColor; border-radius: 999px;
    padding: 0.05rem 0.55rem; white-space: nowrap;
  }
  .updated { margin-left: auto; font-size: 0.65rem; letter-spacing: 0.1em; color: var(--text-muted); white-space: nowrap; }

  .title {
    margin-top: 0.55rem; font-size: 1.7rem; font-weight: 300; line-height: 1.15;
    color: var(--text); overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .meta {
    margin-top: 0.35rem; font-size: 0.9rem; color: var(--text-soft);
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta .at { color: var(--text); font-weight: 600; }
  .meta .note { color: var(--text-muted); }

  .leave {
    margin-top: auto; font-weight: 700; letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums; text-transform: uppercase;
    font-size: 1.5rem; line-height: 1.2; align-self: flex-start;
  }
  .leave.distant { color: var(--distant); font-weight: 400; }
  .leave.approaching { color: var(--approaching); }
  .leave.now {
    color: var(--now-fg); background: var(--now-bg);
    padding: 0.2rem 0.7rem; border-radius: 0.5rem;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .travel { margin-top: 0.3rem; font-size: 0.85rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  .agenda {
    margin-top: 0.8rem; padding-top: 0.6rem; border-top: 1px solid var(--line);
    font-size: 0.8rem; color: var(--text-muted); font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .agenda .time { color: var(--text-soft); font-weight: 600; }

  /* Pane used for connect / configure / empty states. */
  .status { margin: auto; text-align: center; font-size: 0.95rem; color: var(--text-muted); letter-spacing: 0.04em; }
  .status .headline { color: var(--text-soft); font-size: 1.05rem; }
  .status .fine { margin-top: 0.55rem; font-size: 0.75rem; line-height: 1.5; overflow-wrap: anywhere; }
  .status button {
    display: block; margin: 0.9rem auto 0; background: none; border: 1px solid var(--field-border);
    color: var(--text-soft); font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 0.45rem 1.1rem; border-radius: 999px; cursor: pointer;
  }
  .status button:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
  <section id="event-pane" class="pane">
    <div class="top-row">
      <p class="kicker" id="kicker">Next up</p>
      <p class="chip" id="tomorrow-chip" hidden>Tomorrow</p>
      <p class="updated" id="updated" hidden></p>
    </div>
    <p class="title" id="title">—</p>
    <p class="meta" id="meta"></p>
    <p class="leave" id="leave" hidden></p>
    <p class="travel" id="travel" hidden></p>
    <p class="agenda" id="agenda" hidden></p>
  </section>

  <section id="status-pane" class="pane">
    <div class="status">
      <p class="headline" id="status-headline">Connecting…</p>
      <p class="fine" id="status-fine" hidden></p>
      <button type="button" id="connect" hidden>Connect Google Calendar</button>
    </div>
  </section>

<script>
(function () {
  'use strict';

  var API = 'chappy-widget://api';
  var POLL_MS = 60 * 1000;
  var AUTH_POLL_MS = 5 * 1000;
  var APPROACHING_MS = 60 * 60 * 1000;
  var NOW_MS = 5 * 60 * 1000;
  var MODE_GLYPHS = { driving: '🚗', walking: '🚶', transit: '🚈', bicycling: '🚴' };

  var eventPane = document.getElementById('event-pane');
  var statusPane = document.getElementById('status-pane');
  var kickerEl = document.getElementById('kicker');
  var tomorrowChip = document.getElementById('tomorrow-chip');
  var updatedEl = document.getElementById('updated');
  var titleEl = document.getElementById('title');
  var metaEl = document.getElementById('meta');
  var leaveEl = document.getElementById('leave');
  var travelEl = document.getElementById('travel');
  var agendaEl = document.getElementById('agenda');
  var statusHeadline = document.getElementById('status-headline');
  var statusFine = document.getElementById('status-fine');
  var connectButton = document.getElementById('connect');

  var payload = null;
  var pollTimer = null;
  var authClicked = false;
  var timeFormatter = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' });

  function formatTime(iso) {
    return timeFormatter.format(new Date(iso));
  }

  function showPane(pane) {
    eventPane.classList.toggle('active', pane === 'event');
    statusPane.classList.toggle('active', pane === 'status');
  }

  function showStatus(headline, fine, withConnect) {
    showPane('status');
    statusHeadline.textContent = headline;
    statusFine.hidden = !fine;
    statusFine.textContent = fine || '';
    connectButton.hidden = !withConnect;
  }

  /* The line that has to be readable from across the room. Recomputed every
     second from leaveByUtc — no network involved in the countdown itself. */
  function renderLeaveLine() {
    var active = payload && payload.active;
    if (!active || !active.leaveByUtc) {
      leaveEl.hidden = true;
      return;
    }
    var remaining = new Date(active.leaveByUtc).getTime() - Date.now();
    var cls;
    var text;
    if (remaining <= NOW_MS) {
      cls = 'now';
      text = remaining <= 0 ? 'Leave now' : 'Leave in ' + Math.max(1, Math.ceil(remaining / 60000)) + ' min';
    } else if (remaining <= APPROACHING_MS) {
      cls = 'approaching';
      text = 'Leave in ' + Math.ceil(remaining / 60000) + ' min';
    } else {
      cls = 'distant';
      text = 'Leave by ' + formatTime(active.leaveByUtc);
    }
    leaveEl.hidden = false;
    leaveEl.className = 'leave ' + cls;
    leaveEl.textContent = text;
  }

  function renderAgenda(items) {
    if (!items || !items.length) {
      agendaEl.hidden = true;
      return;
    }
    agendaEl.hidden = false;
    agendaEl.textContent = '';
    /* All strings from the API become text nodes — never markup. */
    items.slice(0, 4).forEach(function (item, index) {
      if (index > 0) {
        agendaEl.appendChild(document.createTextNode('  ·  '));
      }
      var time = document.createElement('span');
      time.className = 'time';
      time.textContent = item.allDay ? 'All day' : formatTime(item.startUtc);
      agendaEl.appendChild(time);
      agendaEl.appendChild(document.createTextNode(' ' + item.title));
    });
  }

  function render() {
    if (!payload) {
      return;
    }
    if (payload.status === 'not-configured') {
      showStatus('Google Calendar isn’t set up', payload.detail || 'Fill in ~/.chappy/calendar.json — see docs/CALENDAR-SETUP.md in the Chappy repo.', false);
      return;
    }
    if (payload.status === 'needs-auth') {
      if (authClicked && payload.authPending) {
        showStatus('Approve access in your browser…', 'A Google sign-in tab was opened on this machine.', false);
      } else {
        authClicked = false;
        showStatus('Google Calendar', 'Read-only access, revocable anytime from your Google account.', true);
      }
      return;
    }
    if (payload.status === 'error') {
      showStatus('Calendar unavailable', 'Chappy will keep retrying quietly.', false);
      return;
    }

    updatedEl.hidden = !payload.stale || !payload.lastUpdatedUtc;
    if (!updatedEl.hidden) {
      updatedEl.textContent = 'updated ' + formatTime(payload.lastUpdatedUtc);
    }

    var active = payload.active;
    if (!active) {
      if (payload.agenda && payload.agenda.length) {
        showPane('event');
        kickerEl.textContent = 'Today';
        tomorrowChip.hidden = true;
        titleEl.textContent = 'Nothing else scheduled';
        metaEl.textContent = '';
        leaveEl.hidden = true;
        travelEl.hidden = true;
        renderAgenda(payload.agenda);
      } else {
        showStatus('No upcoming events', '', false);
      }
      return;
    }

    showPane('event');
    kickerEl.textContent = 'Next up';
    tomorrowChip.hidden = !active.isTomorrow;
    titleEl.textContent = active.title;

    metaEl.textContent = '';
    var at = document.createElement('span');
    at.className = 'at';
    at.textContent = formatTime(active.startUtc);
    metaEl.appendChild(at);
    if (active.location) {
      metaEl.appendChild(document.createTextNode('  ·  ' + active.location));
    }
    if (active.travelUnavailable) {
      var note = document.createElement('span');
      note.className = 'note';
      note.textContent = '  ·  travel unavailable';
      metaEl.appendChild(note);
    }

    if (active.travel) {
      travelEl.hidden = false;
      travelEl.textContent =
        (MODE_GLYPHS[active.travel.mode] || '🚗') + ' ' +
        active.travel.durationMinutes + ' min · ' +
        active.travel.distanceKm + ' km';
    } else {
      travelEl.hidden = true;
    }

    renderLeaveLine();
    renderAgenda(payload.agenda);
  }

  function schedulePoll() {
    if (pollTimer) {
      clearTimeout(pollTimer);
    }
    var wait = payload && payload.status === 'needs-auth' && authClicked ? AUTH_POLL_MS : POLL_MS;
    pollTimer = setTimeout(poll, wait);
  }

  function poll() {
    fetch(API + '/next-event')
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(function (data) {
        payload = data;
        render();
      })
      .catch(function () {
        /* Keep showing the last data; only fall to a status screen when the
           widget has never rendered anything (a blank mirror looks broken). */
        if (!payload) {
          showStatus('Calendar unavailable', 'Chappy will keep retrying quietly.', false);
        }
      })
      .then(schedulePoll);
  }

  connectButton.addEventListener('click', function () {
    authClicked = true;
    showStatus('Approve access in your browser…', 'A Google sign-in tab was opened on this machine.', false);
    fetch(API + '/auth/start', { method: 'POST' })
      .then(function (response) { return response.json(); })
      .then(function (result) {
        if (!result.ok) {
          authClicked = false;
          showStatus('Couldn’t start sign-in', result.error || '', true);
        }
      })
      .catch(function () {
        authClicked = false;
        showStatus('Couldn’t start sign-in', '', true);
      });
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(poll, AUTH_POLL_MS);
  });

  /* Countdown ticks locally; state colors shift without any API traffic. */
  setInterval(renderLeaveLine, 1000);
  showStatus('Connecting…', '', false);
  poll();
})();
</script>
</body>
</html>
