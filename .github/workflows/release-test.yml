# Validates that release builds succeed. Runs on push to test.
# Must pass before tagging a release. No GitHub Release is created.
name: Release Test

on:
  push:
    branches:
      - test

permissions:
  contents: read

jobs:
  build-mac:
    name: build-mac
    runs-on: macos-latest
    env:
      # Developer ID signing. Squirrel.Mac (behind electron-updater) refuses to
      # install an update over an ad-hoc-signed app, so a signed build is what
      # makes self-update work on macOS. Notarization stays off (see doc 012).
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build desktop release artifacts
        run: npm run build:desktop:ci

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: release/

  build-windows:
    name: build-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows release artifacts
        run: npm run build:windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/
